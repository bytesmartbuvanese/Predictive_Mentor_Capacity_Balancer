[project]
name = "predictive-mentor-capacity-balancer"
version = "0.1.0"
description = "Forecast student risk and balance mentoring capacity"
readme = "README.md"
authors = [
    { name = "bytesmartbuvanese", email = "bytesmart.buvanese@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.30.0",
    "xgboost>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
